services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: playroom-api
    ports:
      - "${PLAYROOM_API_PORT:-8000}:8000"
    environment:
      PLAYROOM_BACKEND_MODEL: ${PLAYROOM_BACKEND_MODEL:-}
      PLAYROOM_LLM_BASE_URL: ${PLAYROOM_LLM_BASE_URL:-https://api.openai.com/v1}
      PLAYROOM_LLM_API_KEY: ${PLAYROOM_LLM_API_KEY:-}
      PLAYROOM_ENABLE_TEXTBOOK_CONTEXT: ${PLAYROOM_ENABLE_TEXTBOOK_CONTEXT:-true}
      PLAYROOM_ENABLE_WEB_SEARCH: ${PLAYROOM_ENABLE_WEB_SEARCH:-true}
      PLAYROOM_ENABLE_REFLECTION: ${PLAYROOM_ENABLE_REFLECTION:-true}
      TEXTBOOK_DATA_DIR: /app/api/textbook/data
      TEXTBOOK_API_KEY: ${TEXTBOOK_API_KEY:-}
    volumes:
      # Survives rebuilds: pages/, pdfs/, index.sqlite.
      # catalog.json is refreshed from the image on every start (see entrypoint).
      - textbook-data:/app/api/textbook/data
    restart: unless-stopped

volumes:
  textbook-data:
    name: playroom-textbook-data
