services:
  yarkids:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"   # Yar Kids API
      - "8080:8080"   # Textbook Service
    volumes:
      - ./textbook-service/data:/app/textbook-service/data
    environment:
      # LLM Provider (required)
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      YARKIDS_BACKEND_MODEL: "${YARKIDS_BACKEND_MODEL:-gpt-4o-mini}"
      YARKIDS_LLM_BASE_URL: "${YARKIDS_LLM_BASE_URL:-https://api.openai.com/v1}"
      YARKIDS_LLM_API_KEY: "${OPENAI_API_KEY}"
      
      # Textbook Service (internal)
      TEXTBOOK_DATA_DIR: "/app/textbook-service/data"
      TEXTBOOK_HOST: "0.0.0.0"
      TEXTBOOK_PORT: "8080"
      
      # Yar Kids API config
      YARKIDS_TEXTBOOK_API_URL: "http://localhost:8080"
      YARKIDS_ENABLE_TEXTBOOK_CONTEXT: "true"
      YARKIDS_TEXTBOOK_REQUEST_TIMEOUT_SEC: "5.0"
      YARKIDS_ENABLE_WEB_SEARCH: "true"
      YARKIDS_WEB_SEARCH_PROVIDER: "auto"
      YARKIDS_ENABLE_REFLECTION: "true"
      YARKIDS_API_HOST: "0.0.0.0"
      YARKIDS_API_PORT: "8000"
      YARKIDS_CORS_ORIGINS: "*"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s