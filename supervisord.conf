[supervisord]
nodaemon=true
user=appuser
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor

[program:textbook-service]
command=uvicorn app.main:app --host 0.0.0.0 --port 8080
directory=/app/textbook-service
environment=TEXTBOOK_DATA_DIR="/app/textbook-service/data",TEXTBOOK_HOST="0.0.0.0",TEXTBOOK_PORT="8080",PYTHONPATH="/app/textbook-service"
autorestart=true
startsecs=10
stdout_logfile=/var/log/supervisor/textbook-service.log
stderr_logfile=/var/log/supervisor/textbook-service.err.log

[program:yarkids-api]
command=python -m api.main
directory=/app
environment=YARKIDS_TEXTBOOK_API_URL="http://localhost:8080",YARKIDS_API_HOST="0.0.0.0",YARKIDS_API_PORT="8000",PYTHONPATH="/app"
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/yarkids-api.log
stderr_logfile=/var/log/supervisor/yarkids-api.err.log